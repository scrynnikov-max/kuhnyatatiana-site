<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Твой заказ · Кухня Татьяны</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/checkout.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="wrap header-inner"><a class="mark" href="/">Кухня <i>Татьяны</i><span>.</span></a></div>
  </header>
  <main class="wrap section delivery" id="book-delivery">
    <p class="caption">Электронная книга · 100 рецептов</p>
    <h1>Твой <em>заказ</em></h1>
    <p role="status">Проверяем статус заказа…</p>
    <noscript>Включи JavaScript для проверки платежа и скачивания PDF.</noscript>
    <div class="offer-actions">
      <a class="button button-primary" id="download-book" rel="noreferrer" hidden>Скачать книгу в PDF</a>
      <button class="button button-outline" type="button" id="check-book-payment" hidden>Проверить снова</button>
      <a class="button button-outline" href="/#book">Вернуться к книге</a>
    </div>
    <p><a class="underlink" href="https://t.me/foodnutric_bot">Поддержка в Telegram</a></p>
  </main>
</body>
</html>
